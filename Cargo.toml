[workspace]
members = ["wasm"]

# Size matters for the browser build, which ships over the wire; the CLI keeps
# the normal release settings. Cargo only honours profiles at the workspace
# root, and lto/panic cannot vary per package, so this is the part that can.
[profile.release.package.pdf-handouts-wasm]
opt-level = "z"
codegen-units = 1

[package]
name = "pdf-handouts"
version = "1.0.0"
edition = "2021"
authors = ["Rick Wilson"]
description = "Cross-platform PDF manipulation tool for merging PDFs and adding headers/footers"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pdf-handouts"
path = "src/bin/pdf-handouts.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:glob"]
wasm = ["lopdf/wasm_js"]

[dependencies]
# PDF manipulation and merging
lopdf = { version = "0.38", default-features = false, features = ["chrono"] }

# PDF creation for headers/footers
krilla = { version = "0.3", default-features = false, features = ["raster-images", "simple-text"] }
tiny-skia-path = "0.11"
rustybuzz = "0.18"  # Text shaping and measurement

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"], optional = true }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date parsing
chrono = "0.4"

# File globbing
glob = { version = "0.3", optional = true }

[dev-dependencies]
# Testing utilities
tempfile = "3.10"
