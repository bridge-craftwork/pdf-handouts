name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wasm/**'
      - 'web/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  # Lets the site be redeployed without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the WebAssembly bundle
        working-directory: wasm
        run: wasm-pack build --release --target web --out-dir ../web/pkg --no-typescript

      - name: Check the bundle landed
        run: |
          test -f web/pkg/pdf_handouts_wasm_bg.wasm
          test -f web/pkg/pdf_handouts_wasm.js
          ls -lh web/pkg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
