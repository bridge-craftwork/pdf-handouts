name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wasm/**'
      - 'web/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # The hosting half of the deploy: a change to the Pages config or the
      # redirect stub has to redeploy too, or the live site would keep serving
      # the old one with nothing to say so.
      - 'wrangler.jsonc'
      - 'github-pages-redirect/**'
      - '.github/workflows/pages.yml'
  # Lets the site be redeployed without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest wins: a superseded deploy has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read here rather than inside a step so a step's `if` can test them —
  # secrets cannot be referenced directly in `if`.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ── The site — Cloudflare Pages ────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the WebAssembly bundle
        working-directory: wasm
        run: wasm-pack build --release --target web --out-dir ../web/pkg --no-typescript

      # A missing bundle produces a page that loads, shows the whole interface,
      # and then does nothing when you give it a file. Fail here instead.
      - name: Check the bundle landed
        run: |
          test -f web/pkg/pdf_handouts_wasm_bg.wasm
          test -f web/pkg/pdf_handouts_wasm.js
          ls -lh web/pkg

      # Cloudflare Pages is now the only host for the tool itself, so a silent
      # skip would be dangerous: the run would go green having deployed
      # nothing. Fail explicitly when the credential is missing, while still
      # letting a fork build.
      - name: Require the Cloudflare credential
        if: github.repository == 'bridge-craftwork/pdf-handouts' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so the site cannot be deployed." >&2
          echo "The token needs Account -> Cloudflare Pages -> Edit on this account." >&2
          exit 1

      # What the credential actually is, and what it can reach. Cloudflare
      # reports several different problems as the same opaque error — a wrong
      # account id, a token without Pages permission, and a token for another
      # account all surface as "Could not route ... [code: 7003]" — so pin down
      # which one before trying to deploy.
      #
      # `whoami` needs no account id, so it separates "the token is bad" from
      # "the account id is bad". Neither an account id nor a permission list is
      # a credential; the account id is in this org's configs already.
      - name: Identify the credential
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@4 whoami

      # A pasted secret that picked up a newline or a space produces exactly
      # the 7003 above, and nothing else in the output would show it.
      - name: Check the account id's shape
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID} (expected 32)"
          if printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "account id shape: OK"
          else
            echo "account id shape: WRONG — expected 32 lowercase hex characters."
            echo "Whitespace picked up when pasting the secret looks exactly like this."
          fi

      - name: Show what the credential can reach
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages project list

      # First deploy only: `pages deploy` cannot create a project without a
      # prompt, and there is no prompt in CI. Idempotent — a second run finds
      # the project already there and moves on.
      - name: Create the Pages project if it does not exist
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw 'pdf-handouts'; then
            echo "Project pdf-handouts already exists."
          else
            npx --yes wrangler@4 pages project create pdf-handouts --production-branch main
          fi

      # `--commit-dirty` because the checkout now carries the generated wasm
      # bundle, which wrangler would otherwise refuse to deploy from.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true

  # ── The old address — GitHub Pages, now a redirect stub ────────────────
  # The tool itself lives on Cloudflare Pages, mounted at
  # bridge-craftwork.com/pdf-handouts/. This publishes only a redirect, because
  # this URL was the tool's public address long enough that the README and
  # other people's links point at it. A dead link is a worse outcome than a hop.
  #
  # Safe to do now, and NOT before: it was only once the site Worker started
  # serving /pdf-handouts/ from pages.dev that a stub pointing there stopped
  # being a loop back to this host.
  #
  # No build step here any more — the stub is three dozen lines of static HTML.
  #
  # Independent of the Cloudflare job rather than `needs:` it, so a credential
  # problem there cannot also take down the address people already have.
  github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
